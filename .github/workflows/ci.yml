name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25.12"
  GOVULNCHECK_VERSION: "v1.6.0"
  EUPROVGUARD_VERSION: "v1.0.1"
  PALLAS_VERSION: "v2.0.3"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build runtime module
        run: go build ./...

      - name: Build runtime module with doctor tag
        run: go build -tags run_foundation_doctor ./...

      - name: Build development tools
        working-directory: dev
        run: go build ./...

      - name: Build Foundation CLI
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            ext=""
            if [ "${os}" = "windows" ]; then
              ext=".exe"
            fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -o "../dist/foundation-${os}-${arch}${ext}" ./cmd/foundation
          done

      - name: Upload Foundation CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-cli
          path: dist/
          if-no-files-found: error

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download Foundation CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: foundation-cli
          path: dist

      - name: Restore CLI permissions
        run: chmod +x dist/foundation-linux-amd64

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run doctor-tagged tests with race detector
        run: go test -race -tags run_foundation_doctor ./...

      - name: Run vet
        run: go vet ./...

      - name: Run doctor-tagged vet
        run: go vet -tags run_foundation_doctor ./...

      - name: Check Foundation declarations
        run: ./dist/foundation-linux-amd64 check ./...

      - name: Check generated registries
        run: ./dist/foundation-linux-amd64 generate -check ./...

      - name: Test development tools
        working-directory: dev
        run: go test -race ./...

      - name: Vet development tools
        working-directory: dev
        run: go vet ./...

      - name: Test VS Code integration
        working-directory: editors/vscode
        run: |
          node --check core.js
          node --check extension.js
          node --test

      - name: Scan runtime vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Scan development tool vulnerabilities
        working-directory: dev
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  compliance:
    name: Compliance
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install EUProvGuard
        run: go install github.com/mirkobrombin/euprovguard@${{ env.EUPROVGUARD_VERSION }}

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=0.0.0-${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Scan runtime module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compliance
          euprovguard \
            -path . \
            -name go-foundation \
            -version-tag "${{ steps.version.outputs.value }}" \
            -output compliance/sbom-runtime.json \
            -bundle compliance/report-runtime 2>&1 | tee compliance/scan-runtime.log

      - name: Scan development tools module
        shell: bash
        run: |
          set -euo pipefail
          euprovguard \
            -path dev \
            -name go-foundation-dev \
            -version-tag "${{ steps.version.outputs.value }}" \
            -output compliance/sbom-tools.json \
            -bundle compliance/report-tools 2>&1 | tee compliance/scan-tools.log

      # EUProvGuard exits 0 even when it reports findings, so the gate reads its
      # output. A scan that cannot be parsed, or that ran without the live
      # vulnerability databases, fails too: an unverifiable scan is not a pass.
      - name: Fail on compliance findings
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for target in runtime tools; do
            sbom="compliance/sbom-${target}.json"
            log="compliance/scan-${target}.log"

            recorded=$(jq '(.vulnerabilities // []) | length' "${sbom}")
            cves=$(sed -n 's/.*CVE findings: \([0-9][0-9]*\).*/\1/p' "${log}" | tail -n 1)
            sast=$(sed -n 's/.*Native SAST completed: found \([0-9][0-9]*\) issues.*/\1/p' "${log}" | tail -n 1)

            echo "${target}: sbom=${recorded} cve=${cves:-missing} sast=${sast:-missing}"

            if [ -z "${cves}" ] || [ -z "${sast}" ]; then
              echo "::error::${target}: EUProvGuard summary could not be parsed"
              failed=1
              continue
            fi
            if grep -q "OSV/EUVD query failed" "${log}"; then
              echo "::error::${target}: vulnerability databases were unreachable"
              failed=1
            fi
            if [ "${recorded}" -gt 0 ] || [ "${cves}" -gt 0 ] || [ "${sast}" -gt 0 ]; then
              echo "::error::${target}: EUProvGuard reported findings"
              failed=1
            fi
          done
          exit "${failed}"

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance-reports
          path: compliance/
          if-no-files-found: error

  docs:
    name: Documentation
    needs: compliance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pallas is tagged v2 without a matching module path, so the tag cannot be
      # resolved by "go install"; it is built from the pinned tag instead.
      - name: Build Pallas
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PALLAS_VERSION}" \
            https://github.com/vanilla-os/pallas.git "${RUNNER_TEMP}/pallas"
          cd "${RUNNER_TEMP}/pallas"
          go build -o "${RUNNER_TEMP}/pallas-bin" ./cmd/pallas

      - name: Generate docs
        run: |
          "${RUNNER_TEMP}/pallas-bin" --dest ./dist .

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./dist
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    name: Deploy documentation
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    name: Release
    needs: [build, test, compliance]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build and compliance artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no artifacts to publish"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
